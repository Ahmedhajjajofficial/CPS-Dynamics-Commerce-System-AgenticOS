name: CPS Dynamics AgenticOS CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # يتيح التشغيل اليدوي للمسار

env:
  GO_VERSION: '1.21.0'
  NODE_VERSION: '18.x'
  PYTHON_VERSION: '3.11'

jobs:
  # 1. التدقيق الأمني (يعمل أولاً)
  security-audit:
    name: Security & Quality Audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. بيئة الواجهة الأمامية (Admin App & POS)
  frontend-suite:
    name: Build & Test Frontend
    runs-on: ubuntu-22.04
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package.json'

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Install Dependencies
        run: make install-app && make install-pos

      - name: Code Linting
        run: make lint-app && make lint-pos

      - name: Build Artifacts
        run: make build-app && make build-pos

  # 3. بيئة الوكيل المحلي (Python Edge Agent)
  local-agent-suite:
    name: Build & Test Local Agent (Python)
    runs-on: ubuntu-22.04
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Native Compilers & Libraries
        run: |
          sudo apt-get update 
          sudo apt-get install -y make protobuf-compiler libsqlite3-dev

      - name: Install Dependencies
        run: |
          pip install --upgrade pip grpcio-tools ruff black
          make install-local-agent

      - name: Code Linting
        run: make lint-local-agent

      - name: Run Tests
        run: make test-local-agent

  # 4. بيئة الوكيل الإقليمي (Go Raft Agent)
  regional-agent-suite:
    name: Build & Test Regional Agent (Go)
    runs-on: ubuntu-22.04
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Protoc & System Tools
        run: sudo apt-get update && sudo apt-get install -y make protobuf-compiler

      - name: Install Go Protobuf Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Install Dependencies
        run: make install-regional-agent

      - name: Lint & Vet
        run: make lint-regional-agent

      - name: Build Binary
        run: make build-regional-agent
        
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # -- تهيئة بيئات التشغيل المعزولة بناءً على نوع المكون --
      - name: Setup Node.js 18 (Frontend)
        if: matrix.component == 'app' || matrix.component == 'pos'
        uses: actions/setup-node@v6
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Setup Python 3.11 (Edge Agent)
        if: matrix.component == 'local-agent'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup Go 1.21 (Regional Agent)
        if: matrix.component == 'regional-agent'
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache: 'go-build'

      # -- تنفيذ أوامر التشغيل الآلي من ملف Makefile --
      - name: Install Dependencies
        run: make install-${{ matrix.component }}

      - name: Run Static Analysis & Linting
        run: make lint-${{ matrix.component }}

      - name: Compile & Build
        run: make build-${{ matrix.component }}
        
      - name: Execute Unit Tests
        run: make test-${{ matrix.component }} || echo "Skipping tests for ${{ matrix.component }} if undefined"

