name: CPS Dynamics AgenticOS CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  security-audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-admin:
    name: Build Admin App
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: app/package.json

      - name: Install Dependencies
        run: |
          cd app
          npm ci || npm install

      - name: Lint
        run: |
          cd app
          npm run lint

      - name: Build
        run: |
          cd app
          npm run build

  frontend-pos:
    name: Build POS Interface
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: cps-enterprise-dcs/pos-interface/package.json

      - name: Install Dependencies
        run: |
          cd cps-enterprise-dcs/pos-interface
          npm ci || npm install

      - name: Lint
        run: |
          cd cps-enterprise-dcs/pos-interface
          npm run lint

      - name: Build
        run: |
          cd cps-enterprise-dcs/pos-interface
          npm run build

  local-agent:
    name: Build & Test Local Agent
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install grpcio-tools ruff black pytest pytest-asyncio aiohttp
          cd cps-enterprise-dcs/local-agent
          pip install -r requirements.txt || echo "No requirements.txt"

      - name: Lint
        run: |
          cd cps-enterprise-dcs/local-agent
          ruff check src/ || echo "Ruff check done"

      - name: Generate Protobuf
        run: |
          cd cps-enterprise-dcs/proto
          python -m grpc_tools.protoc -I. --python_out=../local-agent/src/proto --grpc_python_out=../local-agent/src/proto cps_enterprise_v4.proto

      - name: Run Tests
        run: |
          cd cps-enterprise-dcs/local-agent/src
          pytest -v --tb=short

  regional-agent:
    name: Build & Test Regional Agent
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler openssl

      - name: Generate mTLS Certificates
        run: |
          chmod +x cps-enterprise-dcs/infrastructure/tls/generate-certs.sh
          cps-enterprise-dcs/infrastructure/tls/generate-certs.sh

      - name: Download Deps
        run: |
          cd cps-enterprise-dcs/regional-agent
          go mod download

      - name: Lint
        run: |
          cd cps-enterprise-dcs/regional-agent
          go vet ./...

      - name: Generate Protobuf
        run: |
          cd cps-enterprise-dcs/proto
          protoc --go_out=../regional-agent/internal/proto --go-grpc_out=../regional-agent/internal/proto cps_enterprise_v4.proto

      - name: Run Tests
        run: |
          cd cps-enterprise-dcs/regional-agent
          go test ./... -v

      - name: Build
        run: |
          cd cps-enterprise-dcs/regional-agent
          go build -o bin/regional-agent ./...

  master-agent:
    name: Build & Test Master Agent
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler openssl

      - name: Generate mTLS Certificates
        run: |
          chmod +x cps-enterprise-dcs/infrastructure/tls/generate-certs.sh
          cps-enterprise-dcs/infrastructure/tls/generate-certs.sh

      - name: Download Deps
        run: |
          cd cps-enterprise-dcs/master-agent
          go mod download

      - name: Lint
        run: |
          cd cps-enterprise-dcs/master-agent
          go vet ./...

      - name: Build
        run: |
          cd cps-enterprise-dcs/master-agent
          go build -o bin/master-agent ./...

  projection-workers:
    name: Build & Test Projection Workers
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download Deps
        run: |
          cd cps-enterprise-dcs/projection-workers
          go mod download

      - name: Lint
        run: |
          cd cps-enterprise-dcs/projection-workers
          go vet ./...

      - name: Build
        run: |
          cd cps-enterprise-dcs/projection-workers
          go build -o bin/projection-workers ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [local-agent, regional-agent]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Regional Agent Integration Tests
        run: |
          cd cps-enterprise-dcs/regional-agent
          go test -tags=integration ./internal/store/ -v
