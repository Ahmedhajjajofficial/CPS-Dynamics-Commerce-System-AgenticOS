name: CPS Dynamics AgenticOS CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  GO_VERSION: "1.23"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  security-audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend-admin:
    name: Build Admin App
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: app/package.json

      - name: Install Dependencies
        run: |
          cd app
          npm ci || npm install

      - name: Build
        run: |
          cd app
          npm run build

  frontend-pos:
    name: Build POS Interface
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: cps-enterprise-dcs/pos-interface/package.json

      - name: Install Dependencies
        run: |
          cd cps-enterprise-dcs/pos-interface
          npm ci || npm install

      - name: Build
        run: |
          cd cps-enterprise-dcs/pos-interface
          npm run build

  local-agent:
    name: Build Local Agent
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          pip install --upgrade pip grpcio-tools ruff black pytest
          cd cps-enterprise-dcs/local-agent
          pip install -r requirements.txt || echo "No requirements.txt"

      - name: Lint
        run: |
          cd cps-enterprise-dcs/local-agent
          ruff check . || echo "Ruff check done"

  regional-agent:
    name: Build Regional Agent
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Download Deps
        run: |
          cd cps-enterprise-dcs/regional-agent
          go mod download

      - name: Build
        run: |
          cd cps-enterprise-dcs/regional-agent
          go build -o bin/regional-agent ./...
