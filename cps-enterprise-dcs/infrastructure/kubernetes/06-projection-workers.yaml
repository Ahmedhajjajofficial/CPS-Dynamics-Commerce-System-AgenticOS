---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: projection-workers
  namespace: dcs
  labels:
    app: projection-workers
    component: projections
spec:
  replicas: 3
  selector:
    matchLabels:
      app: projection-workers
  template:
    metadata:
      labels:
        app: projection-workers
        component: projections
    spec:
      serviceAccountName: dcs-projection-workers
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: projection-workers
        image: cps-enterprise-dcs/projection-workers:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dcs-secrets
              key: POSTGRES_URL
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: dcs-config
              key: KAFKA_BROKERS
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep -f projection-workers || exit 1"
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dcs-projection-workers
  namespace: dcs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dcs-projection-workers
  namespace: dcs
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dcs-projection-workers
  namespace: dcs
subjects:
- kind: ServiceAccount
  name: dcs-projection-workers
  namespace: dcs
roleRef:
  kind: Role
  name: dcs-projection-workers
  apiGroup: rbac.authorization.k8s.io
